[osd]
background_opacity = 0.07
monitors = [ "DP-1" ]

[plugin_settings."apex077/eyecare"]
active_duration_minutes = 136
break_duration_seconds = 152

[plugin_settings."goatnath/spotify-lyrics"]
lyrics-panel_placement = "attached"

[plugin_settings."il1v3y/cyberpunk-weather"]
city = "Bangkok"
units = "metric"

[plugins]
auto_update = true
enabled = [
    "dotnetrob/cat",
    "nightwatch75/file-search",
    "noctalia/screen_recorder",
    "cleboost/zed-provider",
    "weinguyen/opencode-companion",
    "dunarand/tmux-provider",
    "nightwatch75/dns-switcher",
    "cleboost/ssh-launcher",
    "yuuto/arch-updater",
    "nomadcxx/gamer-mode",
    "8bury/mini-docker",
    "icefish/phone-connect",
    "cleboost/anilist",
    "noctalia/bongocat",
    "apex077/eyecare",
    "pozzoo/hassio",
    "cleboost/jetbrains-provider",
    "rxtsel/portctl",
    "thepunkoff/pomodoro",
    "lucasoe/proton-pass",
    "noctalia/world_clock",
    "il1v3y/cyberpunk-weather",
    "il1v3y/cyberpunk-network",
    "il1v3y/cyberpunk-messages",
    "il1v3y/cyberpunk-pomodoro",
    "yocraft/web-launcher",
    "aristides/udiskie",
    "goatnath/spotify-lyrics",
    "weinguyen/procmon"
]

    [[plugins.source]]
    enabled = false
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    enabled = false
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[shell]
font_family = "MesloLGL Nerd Font"
lang = "en"
polkit_agent = true
settings_window_translucent = true

    [shell.launcher]
    compact = true

    [shell.panel]
    borders = false
    polkit_placement = "attached"
    shadow = false
    transparency_mode = "glass"

    [shell.screen_corners]
    size = 98

[theme]
builtin = "Dracula"
community_palette = "Murasaki"
custom_palette = "noctalia-wallpaper-fs"
source = "wallpaper"
wallpaper_scheme = "vibrant"

    [theme.templates]
    builtin_ids = [ "alacritty", "cava", "emacs", "helix", "kitty", "niri", "qt" ]
    community_ids = [ "zen-browser", "blender", "gimp", "heroiclauncher", "steam" ]
    enable_builtin_templates = false
    enable_community_templates = false

[wallpaper]
edge_smoothness = 0.5
per_monitor_directories = true
transition_duration = 2000
transition_on_startup = true

    [wallpaper.automation]
    enabled = true
    interval_seconds = 110

[weather]
enabled = true

[widget.active_window]
font_family = "MesloLGL Nerd Font"
font_weight = 700
max_length = 230
scale = 0.85
title_scroll = "on_hover"

[widget.audio_visualizer]
width = 152

[widget.bar_2]
type = "noctalia/world_clock:bar"

[widget.cat]
cat_size = 30
type = "dotnetrob/cat:cat"

[widget.cat_2]
audio_spectrum = true
tappy_mode = true
type = "noctalia/bongocat:cat"

[widget.clock]
scroll_repeat = "gesture"

[widget.control-center]
glyph = "topology-ring-2"

[widget.cpu]
glyph = "cpu"

[widget.eyecare-widget]
type = "apex077/eyecare:eyecare-widget"

[widget.file-search]
glyph = "navigation-search"
type = "nightwatch75/file-search:file-search"

[widget.gamermode]
type = "nomadcxx/gamer-mode:gamermode"

[widget.keyboard_layout]
show_label = false

[widget.lyrics]
type = "goatnath/spotify-lyrics:lyrics"

[widget.media]
art_size = 18
title_scroll = "on_hover"

[widget.mini-docker]
type = "8bury/mini-docker:mini-docker"

[widget.network]
show_label = false
vpn_status = "both"

[widget.spacer_3]
type = "spacer"

[widget.spacer_4]
type = "spacer"

[widget.spacer_5]
type = "spacer"

[widget.tracker]
type = "cleboost/anilist:tracker"

[widget.widget]
type = "weinguyen/opencode-companion:widget"

[widget.widget_2]
type = "yuuto/arch-updater:widget"

[widget.widget_3]
capsule = true
icon_only = true
show_count = false
type = "weinguyen/procmon:widget"

[widget.workspaces]
font_family = "MesloLGL Nerd Font"
font_weight = 400
hide_when_empty = true
label_source = "name"
labels_only_when_occupied = false
max_label_chars = 6
scroll_repeat = "gesture"
