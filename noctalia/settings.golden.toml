# Sanitized Noctalia settings snapshot (reference only).
# Private data removed: API keys, secrets, personal paths.
# This file documents the configuration structure, NOT live state.

config_version = 12

[backdrop]
enabled = true

[bar]
order = [ "default", "bar2" ]

    [bar.bar2]
    background_opacity = 0.0
    capsule = true
    capsule_opacity = 0.5
    capsule_thickness = 0.69
    center = [ "tracker", "privacy", "widget" ]
    contact_shadow = true
    enabled = true
    end = [ "bar_2", "caffeine", "lyrics" ]
    font_family = "MesloLGL Nerd Font"
    font_weight = 400
    icon_color = "hover"
    position = "right"
    radius = 80
    radius_bottom_right = 0
    radius_top_right = 0
    start = [ "audio_visualizer", "spacer_5", "widget_3" ]

        [bar.bar2.monitor.DP-1]

        [bar.bar2.monitor.DP-2]
        enabled = false

        [bar.bar2.monitor.HDMI-A-1]
        enabled = false

    [bar.default]
    background_opacity = 0.0
    capsule = true
    capsule_opacity = 0.5
    center = [ "group:g5", "spacer_4", "control-center", "eyecare-widget", "cat_2" ]
    end = [ "media", "tray", "group:g2", "group:g1", "session" ]
    font_family = "MesloLGL Nerd Font"
    font_weight = 400
    radius = 80
    radius_top_left = 0
    radius_top_right = 0
    shadow = false
    start = [ "workspaces", "group:g4", "active_window" ]

        [bar.default.monitor.DP-1]

        [bar.default.monitor.DP-2]
        enabled = false

        [bar.default.monitor.HDMI-A-1]
        enabled = false

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "network", "bluetooth", "volume", "brightness" ]
        opacity = 1.0
        padding = 6.0
        widget_spacing = 0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border = ""
        enabled = true
        fill = "surface_variant"
        id = "g2"
        members = [ "notifications", "clipboard" ]
        opacity = 1.0
        padding = 6.0
        widget_spacing = 1

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g5"
        members = [ "cat", "clock" ]
        opacity = 1.0
        padding = 6.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g4"
        members = [
            "file-search",
            "cpu",
            "spacer_3",
            "gamermode",
            "widget_2",
            "mini-docker",
            "il1v3y/cyberpunk-pomodoro:cyber-pomodoro"
        ]
        opacity = 1.0
        padding = 6.0

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "power_profile"

