[Unit]
After=niri.service
# These keys belong in [Unit]; the main file had them in [Service] (ignored).
StartLimitIntervalSec=60
StartLimitBurst=3

[Service]
ExecStartPre=/bin/sh -c "for i in $(seq 1 40); do sock=\"${XDG_RUNTIME_DIR}/${WAYLAND_DISPLAY:-wayland-1}\"; [ -S \"$sock\" ] && exit 0; sleep 0.25; done; exit 0"
